[project]
name = "fan-wallpaper"
version = "1.0.0"
description = "Windows 桌面壁纸轮播，遮盖层实现，不修改系统壁纸"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "diky87688973" }]
dependencies = [
    "Pillow>=10.0,<13",
    "pystray>=0.19,<1",
    "pywebview>=5.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17", "tomli>=2; python_version < '3.11'"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "SIM", "RUF"]
# RUF001/002/003 报告全角标点与 ASCII 混淆；本项目文案是中文，全角标点为预期用法
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["wallpaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=wallpaper --cov=wallpaper_app --cov-report=term-missing --cov-report=json:coverage.json"

[tool.coverage.run]
source = ["wallpaper"]
omit = [
    # 需要交互式桌面会话才能创建 Tk 窗口
    "wallpaper/ui.py",
    # 需要 WebView2 运行时并挂到桌面壁纸层
    "wallpaper/wallview.py",
    # 装配层：构造即创建 Tk 根窗口、注册托盘回调、启动事件循环，单元层无法实例化
    "wallpaper_app.py",
]

[tool.coverage.report]
# 口径为可在无桌面环境执行的七个模块，逐模块下限见 scripts/check_coverage.py
fail_under = 80
show_missing = true
